<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Beat Lab | DJ & Guitar Lessons, Workshops & Merch</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .vinyl-spin { animation: spin 20s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* DJ Mixing Desk Surface Texture & Hardware Accents */
        .mixing-desk {
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #030712 100%);
            border: 2px solid #1e293b;
            box-shadow: inset 0 2px 6px rgba(255,255,255,0.05), 0 20px 25px -5px rgba(0, 0, 0, 0.7);
        }
        
        .controller-pad {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }
        .controller-pad:hover {
            border-color: #22d3ee;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.3), inset 0 2px 4px rgba(255,255,255,0.1);
        }
        .controller-pad:active {
            transform: translateY(2px);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
        }
        
        /* Rotary Knob Style */
        .rotary-knob {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(145deg, #334155, #0f172a);
            border: 2px solid #475569;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rotary-knob::after {
            content: '';
            position: absolute;
            top: 4px;
            width: 2px;
            height: 12px;
            background-color: #22d3ee;
            border-radius: 1px;
        }

        /* DJ Fader / Slider Styling */
        input[type=range] {
            accent-color: #22d3ee;
            cursor: pointer;
        }
    </style>
</head>
